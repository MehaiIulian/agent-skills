name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skills, agents, and config sync
        run: |
          python3 scripts/validate.py
          python3 scripts/tune.py apply --check

      - name: Run unit test suite
        run: python3 -m unittest discover -v tests
